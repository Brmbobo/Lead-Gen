[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-gen"
version = "1.0.0"
description = "Enterprise-grade lead generation platform with AI-powered outreach"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Lead-Gen Team", email = "team@lead-gen.io" }
]
keywords = [
    "lead-generation",
    "ai",
    "automation",
    "google-places",
    "openai",
    "enterprise"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # FastAPI
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Async HTTP
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",

    # Google APIs
    "google-auth>=2.23.0",
    "gspread>=5.12.0",

    # OpenAI
    "openai>=1.6.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",

    # Logging & Observability
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",

    # Security
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",

    # Utilities
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
    "pyrate-limiter>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.12.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

vault = [
    "hvac>=2.1.0",  # HashiCorp Vault
]

aws = [
    "boto3>=1.34.0",  # AWS Secrets Manager
]

[project.scripts]
lead-gen = "lead_gen.cli:main"

[project.urls]
Homepage = "https://github.com/lead-gen/lead-gen"
Documentation = "https://lead-gen.readthedocs.io"
Repository = "https://github.com/lead-gen/lead-gen"
Issues = "https://github.com/lead-gen/lead-gen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_gen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/lead_gen --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "gspread.*",
    "google.*",
    "hvac.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "ASYNC",  # flake8-async
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (ok in tests)
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.coverage.run]
source = ["src/lead_gen"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
